[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agentic-mcp-foundation"
version = "0.1.0"
description = "Reusable local MCP lifecycle: durable jobs, discovery and verified launchers"
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
dependencies = ["httpx>=0.27,<1"]

[project.scripts]
agentic-mcp = "agentic_mcp_foundation.scaffold:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11", "mcp>=1.12,<2"]

[project.urls]
Homepage = "https://github.com/GeorgeQLe/agentic-mcp-foundation"
Issues = "https://github.com/GeorgeQLe/agentic-mcp-foundation/issues"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
